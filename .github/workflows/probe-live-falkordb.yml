name: Probe Live FalkorDB Dashboard

on:
  push:
    branches:
      - chatgpt/falkordb-native-win-ci
    paths:
      - '.github/workflows/probe-live-falkordb.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe live endpoint
        shell: bash
        run: |
          set -u
          HOST='db.houseofkublai.com:18443'
          TS="$(date +%s)"
          echo "=== DNS ==="
          getent ahosts db.houseofkublai.com || true
          echo "=== DASHBOARD HEADERS/BODY ==="
          curl -k -sS --connect-timeout 10 --max-time 20 -D /tmp/h1 -o /tmp/dashboard "https://$HOST/dashboard?probe=$TS" || echo "curl dashboard exit=$?"
          cat /tmp/h1 2>/dev/null || true
          echo "--- dashboard markers ---"
          grep -Eo 'dashboard-auth-v[0-9]+|/dashboard/app\.js[^" ]*|/dashboard/style\.css[^" ]*' /tmp/dashboard 2>/dev/null || true
          echo "=== APP.JS HEADERS/BODY MARKERS ==="
          curl -k -sS --connect-timeout 10 --max-time 20 -D /tmp/h2 -o /tmp/app "https://$HOST/dashboard/app.js?probe=$TS" || echo "curl app exit=$?"
          cat /tmp/h2 2>/dev/null || true
          grep -E 'X-FalkorDB-Dashboard-Authorization|Authorization|authMode|viewerPassword|tokenInput' /tmp/app 2>/dev/null | head -30 || true
          echo "=== AUTH STATUS ==="
          curl -k -sS --connect-timeout 10 --max-time 20 -D /tmp/ha -o /tmp/authstatus "https://$HOST/dashboard/auth-status?probe=$TS" || echo "curl auth-status exit=$?"
          cat /tmp/ha 2>/dev/null || true
          cat /tmp/authstatus 2>/dev/null || true
          echo
          echo "=== DASHBOARD BODY-AUTH BAD CREDS (EXPECTED 401) ==="
          curl -k -sS --connect-timeout 10 --max-time 20 -D /tmp/hb -o /tmp/bodyauth -H 'Content-Type: application/json' --data '{"viewer_username":"viewer","viewer_password":"__definitely_wrong__","api_token":""}' "https://$HOST/dashboard/overview?probe=$TS" || echo "curl bodyauth exit=$?"
          cat /tmp/hb 2>/dev/null || true
          cat /tmp/bodyauth 2>/dev/null || true
