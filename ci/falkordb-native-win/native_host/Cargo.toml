[package]
name = "falkordb-native-host"
version = "0.3.0"
edition = "2024"
license = "SSPL-1.0"

[dependencies]
graph = { path = "../build/src/FalkorDB/graph" }
parking_lot = { version = "0.12.5", features = ["arc_lock"] }
atomic_refcell = "0.1.14"
thin-vec = "0.2.18"
crc32fast = "1.5"
orx-tree = "2.2.0"
rustls = { version = "0.23.39", default-features = false, features = ["ring", "std", "tls12"] }

[profile.release]
lto = true
codegen-units = 1
