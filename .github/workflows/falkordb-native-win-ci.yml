name: FalkorDB native Windows CI

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/falkordb-native-win-ci
    paths:
      - 'ci/falkordb-native-win/**'
      - '.github/workflows/falkordb-native-win-ci.yml'

permissions:
  contents: read

concurrency:
  group: falkordb-native-win-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upstream-falkordb-dump:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install FalkorDB clients
        run: python -m pip install --disable-pip-version-check --upgrade falkordb redis

      - name: Generate DUMP with official FalkorDB
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name upstream-falkordb -p 6379:6379 falkordb/falkordb-server:v4.20.6
          trap 'docker logs upstream-falkordb || true; docker rm -f upstream-falkordb || true' EXIT
          python - <<'PY'
          import time
          from redis import Redis
          client = Redis(host="127.0.0.1", port=6379, socket_connect_timeout=1)
          for _ in range(120):
              try:
                  if client.ping():
                      break
              except Exception:
                  pass
              time.sleep(0.25)
          else:
              raise SystemExit("official FalkorDB container did not become ready")
          PY
          python ci/falkordb-native-win/tests/upstream_dump_fixture.py generate \
            --host 127.0.0.1 \
            --port 6379 \
            --output ci/falkordb-native-win/build/upstream-fixture/upstream-real.dump
          python ci/falkordb-native-win/scripts/falkordb_portable_bundle.py export \
            --source-host 127.0.0.1 \
            --source-port 6379 \
            --bundle ci/falkordb-native-win/build/upstream-fixture/upstream-real.falkor.zip

      - name: Upload upstream FalkorDB DUMP
        uses: actions/upload-artifact@v4
        with:
          name: upstream-falkordb-v4.20.6-dump
          path: |
            ci/falkordb-native-win/build/upstream-fixture/upstream-real.dump
            ci/falkordb-native-win/build/upstream-fixture/upstream-real.dump.json
            ci/falkordb-native-win/build/upstream-fixture/upstream-real.falkor.zip
          if-no-files-found: error

  windows-native:
    needs: upstream-falkordb-dump
    runs-on: windows-2025
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download upstream FalkorDB DUMP
        uses: actions/download-artifact@v4
        with:
          name: upstream-falkordb-v4.20.6-dump
          path: ci/falkordb-native-win/build/upstream-fixture

      - name: Install Rust MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          targets: x86_64-pc-windows-msvc

      - name: Show environment
        shell: pwsh
        run: |
          git --version
          cmake --version
          python --version
          rustc -Vv
          cargo -V
          Get-Command cl.exe -ErrorAction SilentlyContinue
          Get-Command link.exe -ErrorAction SilentlyContinue

      - name: Restore native dependency cache
        id: native-deps
        uses: actions/cache@v4
        with:
          path: ci/falkordb-native-win/build/native-prefix
          key: falkordb-native-deps-${{ runner.os }}-${{ hashFiles('ci/falkordb-native-win/scripts/bootstrap_windows.ps1') }}

      - name: Bootstrap source with cached native dependencies
        if: steps.native-deps.outputs.cache-hit == 'true'
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process Bypass
          & '.\ci\falkordb-native-win\scripts\bootstrap_windows.ps1' -SkipNativeDeps

      - name: Bootstrap native dependencies
        if: steps.native-deps.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process Bypass
          & '.\ci\falkordb-native-win\scripts\bootstrap_windows.ps1'

      - name: Install official FalkorDB Python client
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --upgrade falkordb trustme

      - name: Compile, link, and run smoke test
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process Bypass
          & '.\ci\falkordb-native-win\scripts\diagnose.ps1'

      - name: Save Rust build cache
        if: always() && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ci/falkordb-native-win/build/cargo-target
          key: falkordb-native-rust-${{ runner.os }}-${{ hashFiles('ci/falkordb-native-win/native_host/Cargo.toml') }}

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: falkordb-native-windows-diagnostics
          path: ci/falkordb-native-win/build/logs
          if-no-files-found: ignore
