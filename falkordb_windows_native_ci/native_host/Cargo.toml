[package]
name = "falkordb-native-host"
version = "0.3.0"
edition = "2024"
license = "SSPL-1.0"
build = "build.rs"

[features]
default = ["redisearch_link_stubs"]
# Temporary bring-up mode only. Satisfies current RediSearch FFI symbols with
# aborting stubs so non-indexed Cypher can link and run natively while the
# upstream native FalkorDB index backend is completed/wired.
redisearch_link_stubs = []

[dependencies]
graph = { path = "../build/src/FalkorDB/graph" }
parking_lot = { version = "0.12.5", features = ["arc_lock"] }
atomic_refcell = "0.1.14"

[build-dependencies]
cc = "1.2"

[profile.release]
lto = true
codegen-units = 1
