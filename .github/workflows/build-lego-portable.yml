name: Build portable lego helper

on:
  push:
    branches:
      - chatgpt/acme-portable-bundle
    paths:
      - '.github/workflows/build-lego-portable.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2022
    steps:
      - name: Download verified lego Windows x64
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/go-acme/lego/releases/download/v5.5.2/lego_v5.5.2_windows_amd64.zip"
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile lego.zip
          $expected = "fc544130a2716329cad73a47b674e3aeea019c4753c3963d259bd45d946bbd34"
          $actual = (Get-FileHash lego.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "SHA256 mismatch: $actual" }
          Expand-Archive -Path lego.zip -DestinationPath out
          if (-not (Test-Path out\lego.exe)) { throw "lego.exe missing" }

      - uses: actions/upload-artifact@v4
        with:
          name: lego-v5.5.2-windows-amd64-verified
          path: out/lego.exe
          if-no-files-found: error
