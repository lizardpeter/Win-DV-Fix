name: Webkinz origin verify

on:
  push:
    branches:
      - webkinz-harvest
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Compare play, www, and assets origins
        shell: bash
        run: |
          set +e
          mkdir -p out/files out/meta
          fetch() {
            name="$1"; url="$2"
            echo "$url" > "out/meta/$name.url"
            curl -L --retry 2 --retry-all-errors --connect-timeout 20 --max-time 120 \
              -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36' \
              -D "out/meta/$name.headers" -o "out/files/$name" "$url" \
              >"out/meta/$name.stdout" 2>"out/meta/$name.stderr"
            echo "$?" > "out/meta/$name.exit"
            if [ -f "out/files/$name" ]; then
              wc -c "out/files/$name" > "out/meta/$name.size"
              sha256sum "out/files/$name" > "out/meta/$name.sha256" 2>&1 || true
              file "out/files/$name" > "out/meta/$name.file" 2>&1 || true
            fi
            return 0
          }

          V='v390_249'
          fetch play_webkinz "https://play.webkinz.com/Webkinz.swf?v=$V"
          fetch www_webkinz "https://www.webkinz.com/Webkinz.swf?v=$V"
          fetch play_main2 "https://play.webkinz.com/SWF/main2.swf?v=$V"
          fetch www_main2 "https://www.webkinz.com/SWF/main2.swf?v=$V"
          fetch play_arcade "https://play.webkinz.com/SWF/ARCADE/arcade.swf?v=$V"
          fetch www_arcade "https://www.webkinz.com/SWF/ARCADE/arcade.swf?v=$V"
          fetch play_tips "https://play.webkinz.com/SWF/staticdata/tips.swf?v=$V"
          fetch www_tips "https://www.webkinz.com/SWF/staticdata/tips.swf?v=$V"
          fetch play_webkinz_xml "https://play.webkinz.com/SWF/server/webkinzXML.swf?v=$V"
          fetch www_webkinz_xml "https://www.webkinz.com/SWF/server/webkinzXML.swf?v=$V"
          fetch play_translist "https://play.webkinz.com/XML/L10N/TransList.xml?v=$V"
          fetch www_translist "https://www.webkinz.com/XML/L10N/TransList.xml?v=$V"
          fetch play_l10n_main2 "https://play.webkinz.com/XML/L10N/US_EN/main2.xml"
          fetch www_l10n_main2 "https://www.webkinz.com/XML/L10N/US_EN/main2.xml"
          fetch play_petclasses "https://play.webkinz.com/swf/pet/petclasses.swf?v=$V"
          fetch assets_petclasses "https://assets.webkinz.com/swf/pet/petclasses.swf?v=$V"

          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,re
          rows=[]
          for p in sorted(Path("out/files").glob("*")):
              b=p.read_bytes()
              h=(Path("out/meta")/f"{p.name}.headers").read_text(errors="ignore")
              statuses=[x for x in h.splitlines() if x.startswith("HTTP/")]
              rows.append({
                "name":p.name,
                "url":(Path("out/meta")/f"{p.name}.url").read_text().strip(),
                "size":len(b),
                "sha256":hashlib.sha256(b).hexdigest(),
                "http":statuses,
                "magic":b[:12].hex(),
              })
          Path("out/origin_report.json").write_text(json.dumps(rows,indent=2))
          with Path("out/origin_report.tsv").open("w") as f:
              f.write("name\tsize\tsha256\thttp\turl\n")
              for r in rows:
                  f.write(f"{r['name']}\t{r['size']}\t{r['sha256']}\t{' | '.join(r['http'])}\t{r['url']}\n")
          PY

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webkinz-origin-verify
          path: out/
          retention-days: 7
