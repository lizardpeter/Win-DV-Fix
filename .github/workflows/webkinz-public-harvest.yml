name: Webkinz semantic resource verify

on:
  push:
    branches:
      - webkinz-harvest
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify resources with correct TransList semantics
        shell: bash
        run: |
          set -e
          mkdir -p out
          curl -L --fail --retry 3 --connect-timeout 20 --max-time 120 \
            -A 'Mozilla/5.0' \
            'https://play.webkinz.com/XML/L10N/TransList.xml?v=v390_249' \
            -o out/TransList.xml

          python3 - <<'PY'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          from urllib.parse import quote
          import csv, json, xml.etree.ElementTree as ET, hashlib, time, os

          VERSION="v390_249"
          ROOT="https://play.webkinz.com"
          tree=ET.parse("out/TransList.xml")
          root=tree.getroot()

          pairs=[]
          for e in root.iter():
              n=e.attrib.get("n")
              tf=e.attrib.get("tf")
              if n or tf:
                  pairs.append({"n":n,"tf":tf})

          names=sorted({p["n"] for p in pairs if p.get("n")})
          translations=sorted({p["tf"] for p in pairs if p.get("tf")})

          targets=[]
          aliases=[]
          for n in names:
              ext=os.path.splitext(n)[1].lower()
              if ext==".swf":
                  rel=n.lstrip("/")
                  url=f"{ROOT}/SWF/{quote(rel,safe='/._-~')}?v={VERSION}"
                  targets.append({"kind":"swf","relative":n,"url":url,"expected":"application/x-shockwave-flash"})
              elif ext==".xml":
                  # Current TransList help entries are absolute-root /XML/HELP/... paths.
                  rel=n if n.startswith("/") else "/"+n
                  url=f"{ROOT}{quote(rel,safe='/._-~')}"
                  targets.append({"kind":"xml_resource","relative":n,"url":url,"expected":"xml"})
              else:
                  aliases.append({"kind":"alias","relative":n,"url":"","expected":""})

          for tf in translations:
              rel=tf.lstrip("/")
              url=f"{ROOT}/XML/L10N/US_EN/{quote(rel,safe='/._-~')}"
              targets.append({"kind":"translation","relative":tf,"url":url,"expected":"xml"})

          def probe(t):
              started=time.time()
              req=Request(t["url"],headers={"User-Agent":"Mozilla/5.0","Accept":"*/*"},method="HEAD")
              try:
                  with urlopen(req,timeout=20) as r:
                      return {**t,
                          "status":int(getattr(r,"status",r.getcode())),
                          "content_type":r.headers.get("Content-Type",""),
                          "content_length":r.headers.get("Content-Length",""),
                          "etag":r.headers.get("ETag",""),
                          "last_modified":r.headers.get("Last-Modified",""),
                          "effective_url":r.geturl(),
                          "elapsed_ms":round((time.time()-started)*1000),
                          "error":""}
              except HTTPError as e:
                  return {**t,
                      "status":int(e.code),
                      "content_type":e.headers.get("Content-Type","") if e.headers else "",
                      "content_length":e.headers.get("Content-Length","") if e.headers else "",
                      "etag":e.headers.get("ETag","") if e.headers else "",
                      "last_modified":e.headers.get("Last-Modified","") if e.headers else "",
                      "effective_url":e.geturl() if hasattr(e,"geturl") else t["url"],
                      "elapsed_ms":round((time.time()-started)*1000),
                      "error":str(e)}
              except Exception as e:
                  return {**t,"status":0,"content_type":"","content_length":"","etag":"",
                      "last_modified":"","effective_url":t["url"],
                      "elapsed_ms":round((time.time()-started)*1000),"error":repr(e)}

          results=[]
          with ThreadPoolExecutor(max_workers=32) as ex:
              futs=[ex.submit(probe,t) for t in targets]
              for i,f in enumerate(as_completed(futs),1):
                  results.append(f.result())
                  if i%100==0: print("done",i,"/",len(futs),flush=True)
          results.sort(key=lambda r:(r["kind"],r["relative"].lower()))

          def classify(r):
              if not (200 <= r["status"] < 400):
                  return "missing"
              ct=(r.get("content_type") or "").lower()
              if r["kind"]=="swf":
                  if "shockwave-flash" in ct:
                      return "live"
                  if "text/html" in ct:
                      return "soft_404_html"
                  return "unexpected_content_type"
              else:
                  if "xml" in ct:
                      return "live"
                  if "text/html" in ct:
                      return "soft_404_html"
                  return "unexpected_content_type"

          for r in results:
              r["classification"]=classify(r)

          live=[r for r in results if r["classification"]=="live"]
          dead=[r for r in results if r["classification"]!="live"]

          from collections import Counter,defaultdict
          class_counts=Counter(r["classification"] for r in results)
          by_kind=defaultdict(Counter)
          for r in results: by_kind[r["kind"]][r["classification"]]+=1

          summary={
              "version":VERSION,
              "translist_sha256":hashlib.sha256(Path("out/TransList.xml").read_bytes()).hexdigest(),
              "pairs":len(pairs),
              "unique_n":len(names),
              "swf_entries":sum(os.path.splitext(n)[1].lower()==".swf" for n in names),
              "xml_resource_entries":sum(os.path.splitext(n)[1].lower()==".xml" for n in names),
              "alias_entries":len(aliases),
              "translation_entries":len(translations),
              "network_targets":len(results),
              "live":len(live),
              "not_live":len(dead),
              "classification_counts":dict(class_counts),
              "by_kind":{k:dict(v) for k,v in by_kind.items()},
          }

          Path("out/summary.json").write_text(json.dumps(summary,indent=2))
          Path("out/results.json").write_text(json.dumps(results,indent=2))
          Path("out/live.json").write_text(json.dumps(live,indent=2))
          Path("out/not_live.json").write_text(json.dumps(dead,indent=2))
          Path("out/aliases.json").write_text(json.dumps(aliases,indent=2))

          fields=["kind","relative","classification","status","content_type","content_length","etag","last_modified","elapsed_ms","url","effective_url","error"]
          for fn,rows in [("results.csv",results),("live.csv",live),("not_live.csv",dead)]:
              with open("out/"+fn,"w",newline="",encoding="utf-8") as fh:
                  w=csv.DictWriter(fh,fieldnames=fields,extrasaction="ignore")
                  w.writeheader(); w.writerows(rows)

          Path("out/live_urls.txt").write_text("\n".join(r["url"] for r in live)+"\n")
          Path("out/not_live_urls.txt").write_text("\n".join(r["url"] for r in dead)+"\n")

          md=["# Semantic Webkinz TransList verification","",json.dumps(summary,indent=2),"","## Missing / fallback entries",""]
          for r in dead:
              md.append(f"- {r['classification']}: {r['kind']} {r['relative']} -> {r['content_type']} {r['content_length']}")
          md+=["","## Symbolic aliases",""]
          for a in aliases: md.append(f"- {a['relative']}")
          Path("out/SUMMARY.md").write_text("\n".join(md),encoding="utf-8")
          print(json.dumps(summary,indent=2))
          PY

      - name: Upload semantic verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webkinz-semantic-verify
          path: out/
          retention-days: 7
