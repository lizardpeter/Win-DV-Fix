name: Temporary Webkinz harvest

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Parallel Webkinz endpoint probe
        shell: bash
        run: |
          set +e
          mkdir -p out

          fetch() {
            name="$1"
            url="$2"
            (
              echo "$url" > "out/$name.url"
              curl -L -sS --connect-timeout 6 --max-time 18                 -A "Mozilla/5.0"                 -D "out/$name.headers"                 -o "out/$name.body"                 "$url"
              echo $? > "out/$name.exit"
              wc -c "out/$name.body" > "out/$name.size" 2>/dev/null || true
              file "out/$name.body" > "out/$name.file" 2>/dev/null || true
              sha256sum "out/$name.body" > "out/$name.sha256" 2>/dev/null || true
            ) &
          }

          fetch wconf "https://play.webkinz.com/wconf.js.php"
          fetch latest "https://downloads.webkinz.com/apps/latest.yml"
          fetch playroot "https://play.webkinz.com/"
          fetch webkinz_swf "https://www.webkinz.com/Webkinz.swf?v320_181"
          fetch main2_swf "https://www.webkinz.com/SWF/main2.swf?v=v320_181"
          fetch translist "https://www.webkinz.com/XML/L10N/TransList.xml"
          fetch flashpoint_browse "https://ooooooooo.ooo/browse?search=Webkinz"
          fetch dbapi_query "https://db-api.unstable.life/search?query=Webkinz"
          fetch dbapi_search "https://db-api.unstable.life/search?search=Webkinz"
          fetch cdx_webkinz "https://web.archive.org/cdx/search/cdx?url=www.webkinz.com/Webkinz.swf&output=json&fl=timestamp,original,statuscode,mimetype,digest,length&filter=statuscode:200&limit=20"
          fetch cdx_main2 "https://web.archive.org/cdx/search/cdx?url=www.webkinz.com/SWF/main2.swf&output=json&fl=timestamp,original,statuscode,mimetype,digest,length&filter=statuscode:200&limit=20"
          fetch cdx_jazz "https://web.archive.org/cdx/search/cdx?url=www.webkinz.com/SWF/ARCADE/GAMES/jazz.swf&output=json&fl=timestamp,original,statuscode,mimetype,digest,length&filter=statuscode:200&limit=20"
          wait

          curl -I -L -sS --connect-timeout 6 --max-time 18 -A "Mozilla/5.0"             "https://bluepload.unstable.life/webkinzfiles.7z"             > out/bluepload_head.txt 2>&1 || true

          : > out/all_urls.txt
          : > out/all_uuids.txt
          : > out/interesting_strings.txt
          for f in out/*.body; do
            [ -f "$f" ] || continue
            strings -a -n 5 "$f" | grep -Eai 'https?://|webkinz|\.swf|\.xml|\.php|arcade|api/|loader|main2|assets'               >> out/interesting_strings.txt 2>/dev/null || true
            strings -a -n 8 "$f" | grep -Eao 'https?://[^[:space:]<>"]+'               >> out/all_urls.txt 2>/dev/null || true
            strings -a "$f" | grep -Eao '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}'               >> out/all_uuids.txt 2>/dev/null || true
          done
          sort -u -o out/all_urls.txt out/all_urls.txt
          sort -u -o out/all_uuids.txt out/all_uuids.txt
          sort -u -o out/interesting_strings.txt out/interesting_strings.txt

          {
            echo "=== FILES ==="
            ls -lh out
            echo
            echo "=== UUIDS ==="
            cat out/all_uuids.txt
            echo
            echo "=== URLS ==="
            cat out/all_urls.txt
            echo
            echo "=== BLUEPLOAD ==="
            cat out/bluepload_head.txt
          } > out/SUMMARY.txt

      - name: Upload harvest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webkinz-harvest
          path: out/
          if-no-files-found: error
          retention-days: 7
